[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dosimetry-calculator"
version = "0.1.0"
description = "Cross-platform absolute-dose dosimetry calculator with Spanish interfaces."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oscar Nogales" }]
dependencies = [
    "flet==0.85.3",
    "customtkinter==6.0.0",
    "fpdf2==2.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=6.0,<7",
    "ruff>=0.12,<0.13",
]

[project.scripts]
dosimetry-mobile = "dosimetry_app.mobile.app:run"
dosimetry-desktop = "dosimetry_app.desktop.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
